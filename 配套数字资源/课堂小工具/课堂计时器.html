<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 55%, #43a047 100%);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; user-select: none; padding: 3vh 3vw;
  }
  body.ringing { animation: flashbg .5s steps(2) infinite; }
  @keyframes flashbg { 50% { background: linear-gradient(135deg, #b71c1c 0%, #c62828 55%, #e53935 100%); } }
  h1 { font-size: 2.6vmax; margin-bottom: 1vh; letter-spacing: .3em; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .subtitle { font-size: 1.15vmax; opacity: .75; margin-bottom: 3vh; }
  .presets { display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center; margin-bottom: 3vh; }
  .preset {
    border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14);
    color: #fff; font-family: inherit; font-weight: 700; cursor: pointer;
    font-size: 1.6vmax; padding: .5em 1.3em; border-radius: 14px;
    transition: transform .15s, background .15s;
  }
  .preset:hover { transform: translateY(-3px); background: rgba(255,255,255,.24); }
  .preset.active { background: #ffca28; color: #1b5e20; border-color: #ffca28; box-shadow: 0 0 24px rgba(255,202,40,.55); }
  .display {
    font-size: 17vmax; font-weight: 900; line-height: 1; letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 30px rgba(0,0,0,.45);
    margin-bottom: 2vh;
  }
  .display.warn { color: #ff5252; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .task-label {
    font-size: 1.5vmax; opacity: .85; margin-bottom: 3.5vh; min-height: 1.6em;
  }
  .ctrl { display: flex; gap: 1.2vw; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.16);
    color: #fff; font-family: inherit; font-weight: 700; cursor: pointer;
    font-size: 1.5vmax; padding: .5em 1.8em; border-radius: 14px;
    transition: transform .15s, background .15s;
  }
  .btn:hover { transform: translateY(-3px); background: rgba(255,255,255,.28); }
  .btn.primary { background: #ffca28; color: #1b5e20; border-color: #ffca28; }
  .btn.primary:hover { background: #ffd54f; }
  .hint { margin-top: 3.5vh; font-size: 1vmax; opacity: .55; }
</style>
</head>
<body>
<h1>课堂计时器</h1>
<div class="subtitle">点击分钟数即开始 · 暂停/继续 · 重置</div>

<div class="presets">
  <button class="preset" data-min="1">1 分钟</button>
  <button class="preset" data-min="3">3 分钟</button>
  <button class="preset" data-min="5">5 分钟</button>
  <button class="preset" data-min="10">10 分钟</button>
</div>

<div class="display" id="display">05:00</div>
<div class="task-label" id="taskLabel">点击上方分钟数，开始计时</div>

<div class="ctrl">
  <button class="btn primary" id="pauseBtn" disabled>暂停</button>
  <button class="btn" id="resetBtn">重置</button>
</div>

<div class="hint">"给你们五分钟讨论"——从此是真五分钟 · 单文件离线可用</div>

<script>
(function () {
  var total = 5 * 60, left = total, timer = null, paused = false;
  var display = document.getElementById('display');
  var taskLabel = document.getElementById('taskLabel');
  var pauseBtn = document.getElementById('pauseBtn');
  var resetBtn = document.getElementById('resetBtn');
  var presets = document.querySelectorAll('.preset');

  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' + r : r);
  }
  function render() { display.textContent = fmt(left); }

  function stopAll() {
    if (timer) { clearInterval(timer); timer = null; }
    document.body.classList.remove('ringing');
    display.classList.remove('warn');
  }

  function start(min) {
    stopAll();
    total = left = min * 60; paused = false;
    render();
    taskLabel.textContent = '计时中 · 时间到将响铃';
    pauseBtn.disabled = false; pauseBtn.textContent = '暂停';
    presets.forEach(function (b) { b.classList.toggle('active', +b.dataset.min === min); });
    timer = setInterval(function () {
      left--;
      render();
      if (left <= 10 && left > 0) display.classList.add('warn');
      if (left <= 0) {
        stopAll();
        document.body.classList.add('ringing');
        display.textContent = '00:00';
        taskLabel.textContent = '时间到！';
        try { ring(); } catch (e) {}
        setTimeout(function () { document.body.classList.remove('ringing'); }, 5000);
      }
    }, 1000);
  }

  function ring() {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (var i = 0; i < 3; i++) {
      (function (delay) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.8);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.85);
      })(i * 1.0);
    }
  }

  presets.forEach(function (b) {
    b.addEventListener('click', function () { start(+b.dataset.min); });
  });

  pauseBtn.addEventListener('click', function () {
    if (!timer) return;
    if (!paused) {
      clearInterval(timer); timer = null; paused = true;
      pauseBtn.textContent = '继续';
      taskLabel.textContent = '已暂停 · 还剩 ' + fmt(left);
    } else {
      paused = false; pauseBtn.textContent = '暂停';
      taskLabel.textContent = '计时中 · 时间到将响铃';
      timer = setInterval(function () {
        left--;
        render();
        if (left <= 10 && left > 0) display.classList.add('warn');
        if (left <= 0) {
          stopAll();
          document.body.classList.add('ringing');
          display.textContent = '00:00';
          taskLabel.textContent = '时间到！';
          try { ring(); } catch (e) {}
          setTimeout(function () { document.body.classList.remove('ringing'); }, 5000);
        }
      }, 1000);
    }
  });

  resetBtn.addEventListener('click', function () {
    stopAll();
    left = total; render();
    pauseBtn.disabled = true; pauseBtn.textContent = '暂停';
    taskLabel.textContent = '已重置 · 点击分钟数开始';
    presets.forEach(function (b) { b.classList.remove('active'); });
  });

  render();
})();
</script>
</body>
</html>
