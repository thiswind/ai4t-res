<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂随机点名器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff; min-height: 100vh; padding: 28px;
    color: #18233b;
  }
  .panel { width: min(1120px, 100%); margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 20px; }
  h1 { font-size: 34px; letter-spacing: .06em; }
  .subtitle { color: #64748b; font-size: 16px; }
  .workspace { display: grid; grid-template-columns: 1fr 1.35fr; gap: 24px; align-items: start; }
  .roster-zone, .result-zone, .picked-zone { border: 1px solid #dbe3ef; border-radius: 14px; padding: 18px; }
  .roster-zone label, .picked-zone h2 { font-size: 18px; font-weight: 700; display: block; margin-bottom: 10px; }
  textarea {
    display: block; width: 100%; height: 220px; font-size: 16px; line-height: 1.7;
    padding: 12px; border-radius: 9px; border: 1px solid #b9c6da; resize: vertical;
    background: #fff; color: #18233b; font-family: inherit; user-select: text;
  }
  textarea:focus { outline: 3px solid #93c5fd; border-color: #2563eb; }
  .student-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .student {
    border: 1px solid #dbe3ef; border-radius: 7px; padding: 7px 4px;
    text-align: center; font-size: 16px; color: #18233b; background: #fff;
  }
  .student.picked { color: #8a94a6; background: #eef1f5; border-color: #e0e5ec; text-decoration: line-through; }
  .ctrl-row { display: flex; gap: 12px; align-items: center; margin: 16px 0; }
  .btn { border: 0; cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 9px; }
  .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  .btn-start { flex: 1; font-size: 23px; padding: 13px 20px; background: #1d4ed8; color: #fff; }
  .btn-start:hover { background: #1e40af; }
  .btn-start:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-reset { font-size: 18px; padding: 15px 24px; background: #eef2ff; color: #1e40af; border: 1px solid #c7d2fe; }
  .display { background: #f0f7ff; border: 2px solid #bfdbfe; border-radius: 12px; padding: 24px 12px; text-align: center; }
  .name {
    font-size: 72px; font-weight: 900; letter-spacing: .06em;
    color: #1d4ed8; min-height: 90px; line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .name.rolling { color: #475569; }
  .status { font-size: 19px; color: #475569; margin-top: 12px; min-height: 31px; }
  .picked-zone { margin-top: 18px; }
  .picked-zone h2 { margin-bottom: 12px; }
  .picked-list { display: flex; flex-wrap: wrap; gap: 10px; min-height: 44px; }
  .picked-list span { background: #e5e7eb; border: 1px solid #d1d5db; color: #6b7280; border-radius: 7px; padding: 7px 14px; font-size: 18px; }
  .picked-empty { color: #64748b; font-size: 16px; }
  .footer-tip { margin-top: 18px; font-size: 15px; color: #64748b; text-align: center; }
  @media (max-width: 800px) {
    body { padding: 16px; }
    header { display: block; }
    .subtitle { margin-top: 6px; }
    .workspace { grid-template-columns: 1fr; }
    .student-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .name { font-size: 72px; }
  }
</style>
</head>
<body>
<div class="panel">
  <header>
    <h1>课堂随机点名器</h1>
    <div class="subtitle">每行一个学生 · 自动停止 · 已点不重复</div>
  </header>

  <div class="workspace">
    <section class="roster-zone" aria-labelledby="rosterLabel">
      <label for="roster" id="rosterLabel">学生名单（每行一个学生，如“学生01”）</label>
      <textarea id="roster" placeholder="学生01&#10;学生02&#10;……" spellcheck="false"></textarea>
      <div class="student-list" id="studentList" aria-label="名单状态：灰色为已点且不再抽取"></div>
    </section>

    <section class="result-zone" aria-labelledby="resultLabel">
      <h2 id="resultLabel" style="font-size:18px; margin-bottom:12px;">本次抽中</h2>
      <div class="display" aria-live="polite">
        <div class="name" id="nameDisplay">准备好了吗？</div>
        <div class="status" id="statusBar" role="status">请核对名单，点击“开始点名”；滚动 3 秒后自动停止</div>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-start" id="btnStart" type="button">开始点名</button>
        <button class="btn btn-reset" id="btnReset" type="button">重置已点名单</button>
      </div>
      <div class="picked-zone">
        <h2>已点名单（<span id="pickedCount">0</span> 人）· 灰色姓名不再参与抽取</h2>
        <div class="picked-list" id="pickedList"></div>
      </div>
    </section>
  </div>
  <div class="footer-tip">单文件网页 · 不依赖外部资源 · 断网可用 · 名单只保留在当前浏览器</div>
</div>

<script>
(function () {
  var ROLL_INTERVAL = 200;
  var ROLL_DURATION = 3000;
  var rosterEl = document.getElementById('roster');
  var nameEl = document.getElementById('nameDisplay');
  var statusEl = document.getElementById('statusBar');
  var btnStart = document.getElementById('btnStart');
  var btnReset = document.getElementById('btnReset');
  var studentListEl = document.getElementById('studentList');
  var pickedListEl = document.getElementById('pickedList');
  var pickedCountEl = document.getElementById('pickedCount');

  var picked = [];
  var rolling = false;
  var rollTimer = null;
  var stopTimer = null;
  var pool = [];

  // 每行一个学生；同一行中的重复姓名只计一次。
  function getNames() {
    var seen = Object.create(null);
    return rosterEl.value.split(/\r?\n/).map(function (s) { return s.trim(); })
      .filter(function (s) {
        if (!s || seen[s]) return false;
        seen[s] = true;
        return true;
      });
  }

  function render() {
    var names = getNames();
    studentListEl.textContent = '';
    names.forEach(function (name) {
      var item = document.createElement('span');
      item.className = 'student' + (picked.indexOf(name) !== -1 ? ' picked' : '');
      item.textContent = name;
      studentListEl.appendChild(item);
    });
    pickedCountEl.textContent = picked.length;
    pickedListEl.textContent = '';
    picked.forEach(function (name) {
      var item = document.createElement('span');
      item.textContent = name;
      pickedListEl.appendChild(item);
    });
    if (picked.length === 0) {
      var empty = document.createElement('span');
      empty.className = 'picked-empty';
      empty.textContent = '暂无；抽中的学生会按先后顺序列在这里。';
      pickedListEl.appendChild(empty);
    }
    btnStart.disabled = rolling;
  }

  rosterEl.addEventListener('input', function () {
    try { localStorage.setItem('yw5_rollcall_roster', rosterEl.value); } catch (e) {}
    // 名单变化即开始新一轮，避免旧名单的已点状态混入。
    picked = [];
    nameEl.textContent = '准备好了吗？';
    statusEl.textContent = '名单已更新，点击“开始点名”；滚动 3 秒后自动停止';
    render();
  });

  try {
    var saved = localStorage.getItem('yw5_rollcall_roster');
    if (saved !== null) rosterEl.value = saved;
  } catch (e) {}

  btnStart.addEventListener('click', function () {
    if (rolling) return;
    var names = getNames();
    if (names.length === 0) {
      nameEl.textContent = '名单为空';
      statusEl.textContent = '请先输入学生名单（每行一个学生）';
      return;
    }
    pool = names.filter(function (name) { return picked.indexOf(name) === -1; });
    if (pool.length === 0) {
      nameEl.textContent = '全部点完了';
      statusEl.textContent = '请点击“重置已点名单”，恢复全部学生可抽中状态';
      return;
    }
    rolling = true;
    nameEl.classList.add('rolling');
    nameEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    statusEl.textContent = '滚动中……3 秒后自动停止';
    render();
    rollTimer = setInterval(function () {
      nameEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    }, ROLL_INTERVAL);
    stopTimer = setTimeout(stopRoll, ROLL_DURATION);
  });

  function stopRoll() {
    if (!rolling) return;
    rolling = false;
    clearInterval(rollTimer);
    clearTimeout(stopTimer);
    var winner = pool[Math.floor(Math.random() * pool.length)];
    picked.push(winner);
    nameEl.textContent = winner;
    nameEl.classList.remove('rolling');
    statusEl.textContent = '抽中 ' + winner + ' · 已点不重复 · 剩余 ' + (getNames().length - picked.length) + ' 人';
    render();
  }

  btnReset.addEventListener('click', function () {
    if (rolling) {
      rolling = false;
      clearInterval(rollTimer);
      clearTimeout(stopTimer);
      nameEl.classList.remove('rolling');
    }
    picked = [];
    nameEl.textContent = '准备好了吗？';
    statusEl.textContent = '已清空已点名单，全部学生恢复可抽中状态';
    render();
  });

  render();
})();
</script>
</body>
</html>
